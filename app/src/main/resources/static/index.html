<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Role | Smart Clinic</title>
  <link rel="icon" type="image/png" href="/assets/images/logo/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700&family=Roboto:wght@400;500&display=swap">
  <link rel="stylesheet" href="/assets/css/index.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/js/util.js" defer></script>
  <script src="/js/render.js" defer></script>
  <script src="/js/components/header.js" defer></script>
  <script src="/js/components/footer.js" defer></script>
</head>

<body>
  <div class="container">
    <div class="wrapper">
      <div id="header"></div>

      <main class="main-content">
        <h2>Select Your Role:</h2>
        <button id="adminLogin" class="dashboard-btn">Admin</button>
        <button id="patientBtn" class="dashboard-btn" onclick="selectRole('patient')">Patient</button>
        <button id="doctorLogin" class="dashboard-btn">Doctor</button>
      </main>

      <div id="footer"></div>
    </div>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" id="closeModal">&times;</span>
      <div id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="/js/services/index.js" defer></script>
</body>

</html>
